<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anatomy Atlases</title>
<style>
  body { margin:0; font-family:system-ui,sans-serif; background:#0E0D0B; color:#fff; padding:24px; }
  .author-card { display:flex; align-items:center; gap:16px; max-width:520px; margin:0 auto 32px; padding:16px 20px; border-radius:14px; background:#1a1917; }
  .author-card img { width:72px; height:72px; border-radius:50%; object-fit:cover; }
  .author-card h2 { margin:0 0 4px; font-size:1.2rem; }
  .author-card p { margin:0; color:#aaa; font-size:.9rem; }
  .grid { max-width:720px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
  .grid a { display:block; padding:16px; border-radius:10px; background:#1a1917; color:#fff; text-decoration:none; text-align:center; }
  .grid a:hover { background:#2a2825; }
  footer { text-align:center; color:#777; font-size:.8rem; margin-top:32px; }
</style>
</head>
<body>
  <div class="author-card">
    <img src="helix.jpg" alt="Your name">
    <div>
      <h2>Dr.Helix</h2>
      <p>Based on the Anatomy Atlas by SampleSize_1</p>
    </div>
  </div>

  <div class="grid">
    <a href="bone-atlas/">Bone Atlas</a>
    <a href="bone-landmarks/">Bone Landmarks</a>
    <a href="brain-atlas/">Brain Atlas</a>
    <a href="heart-atlas/">Heart Atlas</a>

    <a href="lymph-atlas/">Lymph Atlas</a>

    <a href="nerve-atlas/">Nerve Atlas</a>
    <a href="organ-atlas/">Organ Atlas</a>
    <a href="tooth-atlas/">Tooth Atlas</a>
  </div>

  <footer>Original tools by SampleSize_1 (samplesize1.com)</footer>
</body>
</html>
